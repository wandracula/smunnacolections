
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Boy Advance - Fullscreen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            color: #ffffff;
            cursor: pointer;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        #start-screen h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        #start-screen p {
            font-size: 1rem;
            color: #888888;
        }

        #game {
            width: 100vw;
            height: 100vh;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Tela de Clique para Ativar Tela Cheia Real -->
    <div id="start-screen">
        <h1>GAME BOY ADVANCE</h1>
        <p>Clique em qualquer lugar para jogar em Tela Cheia</p>
    </div>

    <div id="game"></div>

    <script type="text/javascript">
        const startScreen = document.getElementById('start-screen');
        const gameContainer = document.getElementById('game');

        function entrarEmTelaCheia() {
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen();
            } else if (docEl.mozRequestFullScreen) {
                docEl.mozRequestFullScreen();
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen();
            } else if (docEl.msRequestFullscreen) {
                docEl.msRequestFullscreen();
            }
        }

        startScreen.addEventListener('click', function() {
            entrarEmTelaCheia();

            startScreen.style.display = 'none';
            gameContainer.style.display = 'block';

            // Configuração do Emulador GBA
            EJS_player = '#game';
            EJS_core = 'gba'; // Core configurado para Game Boy Advance (mGBA)
            EJS_gameName = 'Game Boy Advance Game';
            EJS_color = '#000000';
            EJS_startOnLoaded = true;
            EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            
            // Altere para o nome exato do arquivo .gba salvo na raiz do seu GitHub
            EJS_gameUrl = 'smadvance.gba';

            const script = document.createElement('script');
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        });
    </script>

</body>
</html>
