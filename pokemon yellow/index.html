<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Yellow - Local Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            color: #fff;
        }

        #emulator-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .controls-info {
            position: absolute;
            bottom: 10px;
            font-size: 12px;
            color: #555;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="emulator-container">
        <canvas id="mainCanvas" width="160" height="144"></canvas>
    </div>

    <div class="controls-info">
        Setas: D-Pad | Z: Botão A | X: Botão B | Enter: Start | Shift: Select<br>
        <i>Pressione F11 no navegador para ecrã inteiro</i>
    </div>

    <!-- Motores do Emulador Game Boy (Wasm/JS Core) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/binjgb/0.0.1/binjgb.js"></script>

    <script>
        const canvas = document.getElementById('mainCanvas');

        // Carrega o ficheiro local 'pokemon.gbc' diretamente do diretório raiz
        fetch('./pokemon.gbc')
            .then(response => {
                if (!response.ok) {
                    throw new Error("Não foi possível encontrar a ROM 'pokemon.gbc' na mesma pasta.");
                }
                return response.arrayBuffer();
            })
            .then(buffer => {
                const romData = new Uint8Array(buffer);
                iniciarEmulador(romData);
            })
            .catch(err => {
                console.error(err);
                alert("Erro ao carregar o jogo: Certifique-se de que o ficheiro 'pokemon.gbc' está salvo na mesma pasta do 'index.html'.");
            });

        function iniciarEmulador(romData) {
            // Inicialização do core binjgb
            Binjgb().then(emulator => {
                const romPtr = emulator._malloc(romData.length);
                emulator.HEAPU8.set(romData, romPtr);
                
                if (!emulator._emulator_init(romPtr, romData.length)) {
                    alert("Erro ao carregar o arquivo de ROM.");
                    return;
                }

                // Ajusta resolução do canvas mantendo proporção de píxel
                function resizeCanvas() {
                    const aspect = 160 / 144;
                    let width = window.innerWidth;
                    let height = window.innerHeight;

                    if (width / height > aspect) {
                        width = height * aspect;
                    } else {
                        height = width / aspect;
                    }

                    canvas.style.width = `${width}px`;
                    canvas.style.height = `${height}px`;
                }

                window.addEventListener('resize', resizeCanvas);
                resizeCanvas();

                // Loop de execução do jogo
                function step() {
                    emulator._emulator_run_frame();
                    const frameBufferPtr = emulator._emulator_get_display_buffer();
                    const frameBuffer = new Uint8Array(emulator.HEAPU8.buffer, frameBufferPtr, 160 * 144 * 4);

                    const ctx = canvas.getContext('2d');
                    const imgData = ctx.createImageData(160, 144);
                    imgData.data.set(frameBuffer);
                    ctx.putImageData(imgData, 0, 0);

                    requestAnimationFrame(step);
                }

                // Mapeamento de Controles
                const keyMap = {
                    'ArrowLeft': 1,   // Esquerda
                    'ArrowRight': 2,  // Direita
                    'ArrowUp': 4,     // Cima
                    'ArrowDown': 8,   // Baixo
                    'z': 16,          // A
                    'x': 32,          // B
                    'Shift': 64,      // Select
                    'Enter': 128      // Start
                };

                window.addEventListener('keydown', e => {
                    if (keyMap[e.key]) emulator._emulator_set_joypad(keyMap[e.key], true);
                });

                window.addEventListener('keyup', e => {
                    if (keyMap[e.key]) emulator._emulator_set_joypad(keyMap[e.key], false);
                });

                step();
            });
        }
    </script>
</body>
</html>
