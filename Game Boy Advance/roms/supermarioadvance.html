<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Boy Advance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="game"></div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'gba';
        EJS_gameName = 'Game Boy Advance Game';
        EJS_color = '#000000';
        EJS_startOnLoaded = true;
        
        // Servidor CDN oficial e estável
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        // Nome exato da sua ROM de GBA salva na raiz do GitHub
        EJS_gameUrl = 'https://dl.emu-land.net/roms/gba/no-intro/Super%20Mario%20Advance%20%28USA%2C%20Europe%29.zip';
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
