<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Nintendo - Fullscreen</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background-color: #000; overflow: hidden; }
        #game { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div id="game"></div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'snes'; 
        EJS_gameName = 'Super Nintendo Game';
        EJS_color = '#000000';
        EJS_startOnLoaded = true;
        EJS_defaultAudio = true; // Inicia o contexto de áudio sem travar
        
        // Servidor CDN oficial
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        // Link direto da ROM via jsDelivr CDN
        EJS_gameUrl = 'snes/topgear.sfc';
        
        // Otimizações de desempenho para telemóvel
        EJS_scale = '1'; 
        EJS_autoLoadShader = false;
        EJS_disableDatabases = true;
        EJS_threads = false;
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>


  <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                const gameDiv = document.getElementById('game');
                if (gameDiv) {
                    gameDiv.click();
                    // Simula um toque na tela para destravar o motor do emulador
                    const touchEvent = new TouchEvent('touchstart', {
                        bubbles: true,
                        cancelable: true,
                        view: window
                    });
                    gameDiv.dispatchEvent(touchEvent);
                }
            }, 2000); // Aguarda 2 segundos após carregar e dispara o toque
        });
    </script>

    
</body>
</html>
